# main への push / PR ごとにビルドが通るか確認する (署名なし。リリースは release.yml)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dictionary
        run: python3 tools/build_dict.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (release, unsigned; lint 込み)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

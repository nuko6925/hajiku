# v* タグを push すると署名済み APK をビルドして GitHub Releases に添付する
# 必要な Secrets: KEYSTORE_BASE64 (release.jks を base64 化), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dictionary
        run: python3 tools/build_dict.py

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 が空です"; exit 1
          fi
          # 貼り付け時に混ざった改行・空白・CR を除去してからデコード
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.jks
          echo "keystore: $(wc -c < release.jks) bytes"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Hajiku-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Hajiku-${{ github.ref_name }}.apk
